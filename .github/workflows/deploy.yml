name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GitHub Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Project-local .npmrc pins the public npm registry, so no auth needed.
      - run: npm ci

      - name: Build
        env:
          # Browser OAuth client ID (not a secret, but stored in repo config so
          # it is not committed). Set it under Settings -> Secrets and variables
          # -> Actions. Must match the Google Cloud client ID whose Authorized
          # JavaScript origins include the Pages origin.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Provision the Pages site if it does not exist yet, so the first
          # deploy does not require the Settings -> Pages toggle beforehand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
